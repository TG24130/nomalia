<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#01c0c2">
  <meta name="description" content="Préparation de voyage guidée">
  <title>NOMALIA</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icone-192.png">
  <link rel="apple-touch-icon" href="icons/icone-apple-180.png">
  <!-- Sur iOS, ces deux balises conditionnent l'ouverture en plein écran
       depuis l'écran d'accueil ; le manifeste n'y suffit pas. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="NOMALIA">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Photo de fond de l'écran courant, posée derrière tout le reste. -->
  <div class="fond" id="fond" aria-hidden="true"></div>

  <!-- Le nom et le slogan sont posés sur le bandeau ; le titre reste ici
       pour les lecteurs d'écran et les moteurs, sans être affiché deux fois. -->
  <h1 class="invisible" data-i18n="app.nom">NOMALIA</h1>

  <div class="tete">
    <div class="banniere" id="banniere" hidden></div>
    <button class="tete__deconnexion" type="button" id="deconnexion"
            data-i18n="auth.deconnexion" hidden></button>
  </div>

  <!-- Fil des étapes (masqué tant qu'aucun voyage n'est ouvert) -->
  <nav class="parcours" id="parcours" hidden aria-label="Étapes du voyage">
    <div class="parcours__piste">
      <ol class="parcours__liste" id="parcours-liste"></ol>
    </div>
    <p class="parcours__courante" id="parcours-courante"></p>
  </nav>

  <main id="vue" class="vue">
    <!-- Chaque tiroir injecte son contenu ici -->
    <p class="chargement" data-i18n="commun.chargement">Chargement…</p>
  </main>

  <!-- Zone de messages (erreurs, informations) -->
  <div id="message" class="message" role="status" aria-live="polite" hidden></div>

  <footer class="pied">
    <small data-i18n="app.mentionEstimation"></small>
    <small class="pied__env" id="pied-env"></small>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
