<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#01c0c2">
  <meta name="description" content="Préparation de voyage guidée">
  <title>NOMADIA</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icone-192.png">
  <link rel="apple-touch-icon" href="icons/icone-apple-180.png">
  <!-- Sur iOS, ces deux balises conditionnent l'ouverture en plein écran
       depuis l'écran d'accueil ; le manifeste n'y suffit pas. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="NOMADIA">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="entete">
    <img class="entete__logo" src="icons/icone-192.png" alt="" width="72" height="72">
    <!-- Le nom figure déjà dans le logo : le titre reste présent pour les
         lecteurs d'écran et les moteurs, sans être affiché deux fois. -->
    <h1 class="entete__titre invisible" data-i18n="app.nom">NOMADIA</h1>
    <p class="entete__slogan" data-i18n="app.slogan"></p>
    <button class="entete__deconnexion" type="button" id="deconnexion"
            data-i18n="auth.deconnexion" hidden></button>
  </header>

  <!-- Barre de progression des tiroirs (masquée tant qu'aucun voyage n'est ouvert) -->
  <div class="progression" id="progression" hidden>
    <div class="progression__barre" id="progression-barre"></div>
  </div>

  <main id="vue" class="vue">
    <!-- Chaque tiroir injecte son contenu ici -->
    <p class="chargement" data-i18n="commun.chargement">Chargement…</p>
  </main>

  <!-- Zone de messages (erreurs, informations) -->
  <div id="message" class="message" role="status" aria-live="polite" hidden></div>

  <footer class="pied">
    <small data-i18n="app.mentionEstimation"></small>
    <small class="pied__env" id="pied-env"></small>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
