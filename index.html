<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f8b">
  <meta name="description" content="Préparation de voyage guidée">
  <title>MyTrip</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icone-192.png">
  <link rel="apple-touch-icon" href="icons/icone-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="entete">
    <h1 class="entete__titre" data-i18n="app.nom">MyTrip</h1>
    <p class="entete__slogan" data-i18n="app.slogan"></p>
  </header>

  <!-- Barre de progression des tiroirs (masquée tant qu'aucun voyage n'est ouvert) -->
  <div class="progression" id="progression" hidden>
    <div class="progression__barre" id="progression-barre"></div>
  </div>

  <main id="vue" class="vue">
    <!-- Chaque tiroir injecte son contenu ici -->
    <p class="chargement" data-i18n="commun.chargement">Chargement…</p>
  </main>

  <!-- Zone de messages (erreurs, informations) -->
  <div id="message" class="message" role="status" aria-live="polite" hidden></div>

  <footer class="pied">
    <small data-i18n="app.mentionEstimation"></small>
    <small class="pied__env" id="pied-env"></small>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
